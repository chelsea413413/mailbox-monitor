name: Daily Mailbox Crawl

on:
  schedule:
    # 19:00 CST (UTC+8) = 11:00 UTC - after work hours
    - cron: "0 11 * * *"
    # 22:00 CST backup run
    - cron: "0 14 * * *"
  workflow_dispatch:
    inputs:
      provinces:
        description: "Province IDs to crawl (space-separated, empty for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (skip email)"
        type: boolean
        required: false
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Disable IPv6 (Chinese gov sites only support IPv4)
        run: |
          sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.default.disable_ipv6=1
          sudo sysctl -w net.ipv6.conf.lo.disable_ipv6=1

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: mailbox-db-not-exists
          restore-keys: |
            mailbox-db-

      - name: Run crawl
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.provinces }}" ]; then
            ARGS="${{ github.event.inputs.provinces }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.main $ARGS

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: mailbox-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-output-${{ github.run_id }}
          path: output/
          retention-days: 30
